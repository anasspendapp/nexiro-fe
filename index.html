<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Tags -->
    <title>
      Nexiro - AI Photography Studio | Professional Product Photography
    </title>
    <meta
      name="description"
      content="Transform casual snapshots into commercial-grade product and food photography using AI. Professional lighting, material physics, and 8K resolution. Try Nexiro's AI photography studio free."
    />
    <meta
      name="keywords"
      content="AI photography, product photography AI, food photography, AI image generator, commercial photography, 8K rendering, AI studio"
    />
    <meta name="author" content="Nexiro" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph Meta Tags (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Nexiro - AI Photography Studio | Professional Product Photography"
    />
    <meta
      property="og:description"
      content="Transform casual snapshots into commercial-grade product and food photography using AI. Professional lighting, material physics, and 8K resolution."
    />
    <meta property="og:url" content="https://nexiro.io" />
    <meta property="og:site_name" content="Nexiro" />
    <meta property="og:image" content="https://nexiro.io/favicon.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexiro AI Photography Studio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexiro - AI Photography Studio" />
    <meta
      name="twitter:description"
      content="Transform casual snapshots into commercial-grade product and food photography using AI."
    />
    <meta name="twitter:image" content="https://nexiro.io/og-image.png" />
    <meta name="twitter:image:alt" content="Nexiro AI Photography Studio" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nexiro.io" />

    <!-- Preconnect and DNS Prefetch for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    <link rel="dns-prefetch" href="https://api.nexiro.io" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon and Apple Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nexiro",
        "description": "AI Photography Studio for professional product and food photography",
        "url": "https://nexiro.io",
        "applicationCategory": "DesignApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "url": "https://nexiro.io",
          "availability": "https://schema.org/InStock"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "250"
        },
        "author": {
          "@type": "Organization",
          "name": "Nexiro",
          "url": "https://nexiro.io",
          "logo": "https://nexiro.io/favicon.svg"
        },
        "operatingSystem": "Web",
        "inLanguage": "en-US"
      }
    </script>

    <!-- Additional Structured Data for Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nexiro",
        "url": "https://nexiro.io",
        "logo": "https://nexiro.io/logo.png",
        "description": "AI Photography Studio for professional product and food photography",
        "sameAs": [
          "https://twitter.com/nexiro",
          "https://instagram.com/nexiro"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "email": "support@nexiro.io"
        }
      }
    </script>

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #050505;
        color: #ffffff;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .gradient-text {
        background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
